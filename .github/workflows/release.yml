name: Release build
on:
  push: { tags: ["v*"] }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npm test
      - run: npm run build
      - name: Package
        run: cd dist/site && zip -r "../url-parameter-cleaner-${GITHUB_REF_NAME#v}.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: url-parameter-cleaner-${{ github.ref_name }}
          path: dist/url-parameter-cleaner-*.zip
